<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Flow 원격 자동화 실시간 작업 화면</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d0c0b;
      color: #f5efe6;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      background: #171513;
      border-bottom: 1px solid rgba(236, 220, 198, 0.14);
    }
    .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7fc89b;
      box-shadow: 0 0 10px #7fc89b;
    }
    .dot.idle {
      background: #8b8277;
      box-shadow: none;
    }
    h1 {
      font-size: 16px;
      font-weight: 800;
    }
    .status-text {
      font-size: 14px;
      color: #ebd1aa;
      font-weight: 700;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    #liveImg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid rgba(236, 220, 198, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .empty {
      text-align: center;
      color: #9c9286;
      font-size: 15px;
      line-height: 1.7;
    }
    footer {
      padding: 10px 24px;
      background: #141210;
      border-top: 1px solid rgba(236, 220, 198, 0.1);
      font-size: 12.5px;
      color: #b8aea0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <span class="dot" id="liveDot"></span>
      <h1>지오다노 숏츠등록기 · 원격 Google Flow 실시간 작업 모니터</h1>
    </div>
    <div class="status-text" id="statusMsg">연결 확인 중…</div>
  </header>
  <main>
    <img id="liveImg" alt="원격 Flow 실시간 작업 화면" hidden>
    <div class="empty" id="emptyMsg">
      원격 Google Flow 작업 화면을 불러오는 중입니다…<br>
      숏츠등록기에서 [⚡ 원격 Flow 자동 생성]을 시작하면 이곳에 큰 화면으로 실시간 중계됩니다.
    </div>
  </main>
  <footer>
    <span id="logLine">대기 중</span>
    <span id="renderLine">최종 합성 대기</span>
  </footer>

  <script>
    async function tick() {
      try {
        const res = await fetch('/api/state', {cache: 'no-store'});
        const st = await res.json();
        const busy = Boolean(st.flow?.busy || st.render?.busy);
        document.getElementById('liveDot').className = busy ? 'dot' : 'dot idle';
        document.getElementById('statusMsg').textContent = st.render?.busy
          ? `${st.render.stage} (${st.render.progress || 0}%)`
          : (st.flow?.message || '대기 중');
        document.getElementById('logLine').textContent = st.logs?.[0] ? `${st.logs[0].time} · ${st.logs[0].message}` : '';
        document.getElementById('renderLine').textContent = st.render?.lastOutput
          ? `최근 완성: ${st.render.lastOutput.filename}`
          : '';

        if (st.flow?.liveSnapUrl) {
          const img = document.getElementById('liveImg');
          img.src = st.flow.liveSnapUrl;
          img.hidden = false;
          document.getElementById('emptyMsg').hidden = true;
        }
      } catch {}
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
